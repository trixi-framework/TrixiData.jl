name: CI

on:
  push:
    branches:
      - main
    tags: ['v*']
    paths-ignore:
      - 'AUTHORS.md'
      - 'CITATION.bib'
      - 'LICENSE.md'
      - 'NEWS.md'
      - 'README.md'
      - 'SECURITY.md'
      - '.zenodo.json'
      - '.github/workflows/SpellCheck.yml'
      - '.github/workflows/TagBot.yml'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'AUTHORS.md'
      - 'CITATION.bib'
      - 'LICENSE.md'
      - 'NEWS.md'
      - 'README.md'
      - 'SECURITY.md'
      - '.zenodo.json'
      - '.github/workflows/SpellCheck.yml'
      - '.github/workflows/TagBot.yml'
      - 'docs/**'
  workflow_dispatch:

# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

# Cancel redundant CI tests automatically
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    name: ${{ matrix.os }} - Julia ${{ matrix.version }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10' # oldest supported version
          - '1' # latest stable version
        os:
          - ubuntu-latest
        arch:
          - x64
        include:
          - version: '1'
            os: macos-latest
            arch: aarch64
          - version: '1'
            os: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - run: julia -e 'using InteractiveUtils; versioninfo(verbose=true)'
      - uses: julia-actions/cache@v3
        with:
          # Do not restore the `artifacts` directory of the depot from the cache.
          # The whole purpose of TrixiData.jl is to download data sets, so the
          # test suite must really download them on every run. Otherwise, a
          # broken URL or an outdated checksum in `Artifacts.toml` would be
          # masked by a cache filled by an earlier run.
          cache-artifacts: 'false'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        with:
          coverage: true
        env:
          # For authenticated downloads without strict rate limits
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ !cancelled() }}
        with:
          directories: src
      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          files: ./lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage report to Coveralls
        uses: coverallsapp/github-action@v2
        if: ${{ !cancelled() }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./lcov.info
          format: lcov
          flag-name: run-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.arch }}
          parallel: true

  finish:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
