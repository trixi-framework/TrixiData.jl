# Two-dimensional mesh of a gingerbread man, generated with HOHQMesh; see
# `mesh_gingerbread_man` in src/TrixiData.jl.
#
# Original data set (single file `mesh_gingerbread_man.mesh`):
#   Andrew R. Winters: Gingerbread man mesh.
#   Gist, 2021.
#   https://gist.github.com/andrewwinters5000/2c6440b5f8a57db131061ad7aa78ee2b
# It is the output of the HOHQMesh mesh generator applied to the example
# `GingerbreadMan` of HOHQMesh; both are licensed under the MIT license
# (Copyright (c) 2010-present David A. Kopriva and other contributors), a copy
# of which is part of the artifact as `LICENSE.md`.
#
# In contrast to the other data sets, the artifact does not only contain the
# mesh file but also everything needed to recreate it: the control file, a Julia
# environment, and a script that regenerates the mesh and verifies it against
# the distributed file. These are the files of data/mesh_gingerbread_man in the
# repository of TrixiData.jl; see their README.md. The tarball can be recreated
# bit-for-bit via
#   julia> using Tar; Tar.create(dir, "mesh_gingerbread_man.tar")
#   $ gzip -9 -n mesh_gingerbread_man.tar
# where `dir` contains those files and nothing else - in particular not the
# subdirectory `run` created by the script.
[mesh_gingerbread_man]
git-tree-sha1 = "044f6362400ed617f7ae698798488fa286b1c7a6"
lazy = true

    [[mesh_gingerbread_man.download]]
    sha256 = "46840b6e21d74cc286a89831b17df0ab68cef570a05157820c3806b058206a99"
    url = "https://github.com/trixi-framework/TrixiData.jl/releases/download/data-mesh_gingerbread_man/mesh_gingerbread_man.tar.gz"

# Mesh of two tandem spheres, discretized with quadratic (P2) hexahedral
# elements; see `mesh_tandem_spheres_hex_p2` in src/TrixiData.jl.
#
# Original data set (single file `TandemSpheresHexMesh1P2_fixed.inp`, CC BY 4.0):
#   Daniel Doehring: Mesh Tandem Spheres Hexahedra P2 Fixed.
#   Zenodo, 2026. https://doi.org/10.5281/zenodo.18921889
# Julia artifacts can only be downloaded as (compressed) tarballs, while Zenodo
# serves the bare mesh file. Hence, the unmodified file is repackaged as a
# `.tar.gz` archive and attached to a GitHub release of TrixiData.jl; the
# tarball can be recreated bit-for-bit via
#   julia> using Tar; Tar.create(dir, "TandemSpheresHexMesh1P2_fixed.tar")
#   $ gzip -9 -n TandemSpheresHexMesh1P2_fixed.tar
# where `dir` contains only the file downloaded from Zenodo.
[mesh_tandem_spheres_hex_p2]
git-tree-sha1 = "a7db536cdc5eb3c01369302db6e0ed78cd460d3b"
lazy = true

    [[mesh_tandem_spheres_hex_p2.download]]
