# The data sets are listed in alphabetical order.

# Sanitized mesh of the ONERA M6 wing, discretized with straight-sided
# hexahedral elements; see `mesh_onera_m6_wing` in src/TrixiData.jl.
#
# Original data set (MIT license):
#   Daniel Doehring, Hendrik Ranocha, Manuel Torrilhon: Reproducibility
#   repository for "Paired Explicit Relaxation Runge-Kutta Methods".
#   Zenodo, 2025. https://doi.org/10.5281/zenodo.15601890
#   https://github.com/DanielDoehring/paper-2025-perrk
#   commit 2aa58313108d33887b1e87ced393cd32fd4731d5
# Julia artifacts can only be downloaded as (compressed) tarballs, while the
# repository serves bare files. Hence, the mesh file is repackaged as a
# `.tar.gz` archive - together with the license and a `README.md` describing the
# mesh - and attached to a GitHub release of TrixiData.jl; the tarball can be
# recreated bit-for-bit via
#   julia> using Tar; Tar.create(dir, "mesh_onera_m6_wing.tar")
#   $ gzip -9 -n mesh_onera_m6_wing.tar
# where `dir` is data/mesh_onera_m6_wing/ of this repository. It contains the
# tracked files LICENSE and README.md as well as the mesh file itself, which is
# not tracked and has to be downloaded from
# https://raw.githubusercontent.com/DanielDoehring/paper-2025-perrk/2aa58313108d33887b1e87ced393cd32fd4731d5/5_Applications/5_4_ONERA_M6/ONERA_M6_sanitized.inp
[mesh_onera_m6_wing]
git-tree-sha1 = "170b8690d6fc2c0f675ece30c7c159e6a4e79096"
lazy = true

    [[mesh_onera_m6_wing.download]]
    sha256 = "2af2980e901988148ea01b2a3ae9a9a3f3db5c0e7c506048fabd269b80fb4a2e"
    url = "https://github.com/trixi-framework/TrixiData.jl/releases/download/data-mesh_onera_m6_wing/mesh_onera_m6_wing.tar.gz"

# Mesh of two tandem spheres, discretized with quadratic (P2) hexahedral
# elements; see `mesh_tandem_spheres_hex_p2` in src/TrixiData.jl.
#
# Original data set (single file `TandemSpheresHexMesh1P2_fixed.inp`, CC BY 4.0):
#   Daniel Doehring: Mesh Tandem Spheres Hexahedra P2 Fixed.
#   Zenodo, 2026. https://doi.org/10.5281/zenodo.18921889
# Julia artifacts can only be downloaded as (compressed) tarballs, while Zenodo
# serves the bare mesh file. Hence, the unmodified file is repackaged as a
# `.tar.gz` archive and attached to a GitHub release of TrixiData.jl; the
# tarball can be recreated bit-for-bit via
#   julia> using Tar; Tar.create(dir, "TandemSpheresHexMesh1P2_fixed.tar")
#   $ gzip -9 -n TandemSpheresHexMesh1P2_fixed.tar
# where `dir` contains only the file downloaded from Zenodo.
[mesh_tandem_spheres_hex_p2]
git-tree-sha1 = "a7db536cdc5eb3c01369302db6e0ed78cd460d3b"
lazy = true

    [[mesh_tandem_spheres_hex_p2.download]]
    sha256 = "451f1410da26d79c70a63c0d8ec22f78a62549eb35e009261f4a6e6bf8763162"
    url = "https://github.com/trixi-framework/TrixiData.jl/releases/download/data-mesh_tandem_spheres_hex_p2/TandemSpheresHexMesh1P2_fixed.tar.gz"
