# The data sets are listed in alphabetical order.

# Two-dimensional mesh of a gingerbread man, generated with HOHQMesh; see
# `mesh_gingerbread_man` in src/TrixiData.jl.
#
# Original data set (single file `mesh_gingerbread_man.mesh`):
#   Andrew R. Winters: Gingerbread man mesh.
#   Gist, 2021.
#   https://gist.github.com/andrewwinters5000/2c6440b5f8a57db131061ad7aa78ee2b
# It is the output of the HOHQMesh mesh generator applied to the example
# `GingerbreadMan` of HOHQMesh; both are licensed under the MIT license
# (Copyright (c) 2010-present David A. Kopriva and other contributors), a copy
# of which is part of the artifact as `LICENSE.md`.
#
# In contrast to the other data sets, the artifact does not only contain the
# mesh file but also everything needed to recreate it: the control file, a Julia
# environment, and a script that regenerates the mesh and verifies it against
# the distributed file. These are the files of data/mesh_gingerbread_man in the
# repository of TrixiData.jl; see their README.md. The tarball can be recreated
# bit-for-bit via
#   julia> using Tar; Tar.create(dir, "mesh_gingerbread_man.tar")
#   $ gzip -9 -n mesh_gingerbread_man.tar
# where `dir` contains those files and nothing else - in particular not the
# subdirectory `run` created by the script.
[mesh_gingerbread_man]
git-tree-sha1 = "044f6362400ed617f7ae698798488fa286b1c7a6"
lazy = true

    [[mesh_gingerbread_man.download]]
    sha256 = "46840b6e21d74cc286a89831b17df0ab68cef570a05157820c3806b058206a99"
    url = "https://github.com/trixi-framework/TrixiData.jl/releases/download/data-mesh_gingerbread_man/mesh_gingerbread_man.tar.gz"

# Mesh of the NASA Common Research Model (CRM) in its wing-body configuration,
# discretized with straight-sided hexahedral elements; see `mesh_nasa_crm_hex_p1`
# in src/TrixiData.jl.
# Apart from the comment in the `*Heading` line, it is identical to
# `5_Applications/5_5_CommonResearchModel/crm_q3_lin_relabel_m.inp` of
#   Daniel Doehring, Hendrik Ranocha, Manuel Torrilhon: Reproducibility
#   repository for "Paired Explicit Relaxation Runge-Kutta Methods".
#   Zenodo, 2025. https://doi.org/10.5281/zenodo.15601890
#   https://github.com/DanielDoehring/paper-2025-perrk
#   commit 2aa58313108d33887b1e87ced393cd32fd4731d5
# which is the citable source of the mesh and provides its MIT license.
# Julia artifacts can only be downloaded as (compressed) tarballs. Hence, the
# mesh file is repackaged as a `.tar.gz` archive - together with the license
# and a `README.md` describing the mesh - and attached to a GitHub release of
# TrixiData.jl; the tarball can be recreated bit-for-bit via
#   julia> using Tar; Tar.create(dir, "mesh_nasa_crm_hex_p1.tar")
#   $ gzip -9 -n mesh_nasa_crm_hex_p1.tar
# where `dir` is data/mesh_nasa_crm_hex_p1/ of this repository. It contains the
# tracked files LICENSE and README.md as well as the mesh file itself, which is
# not tracked and has to be downloaded from
# https://gist.githubusercontent.com/DanielDoehring/fbc9d785909263ffec76983c4d520fe3/raw/68741ba6c6965b2045af04323bf73df9dab6ed6d/CRM_HIOCFD_2015_meters.inp
[mesh_nasa_crm_hex_p1]
git-tree-sha1 = "6a1ab9445cbba0deab489aa18247a474bd3e1839"
lazy = true

    [[mesh_nasa_crm_hex_p1.download]]
    sha256 = "2a651989e13153fe95f117630dd89c75ef6a0ce112753c0c93768624a3485ae4"
    url = "https://github.com/trixi-framework/TrixiData.jl/releases/download/data-mesh_nasa_crm_hex_p1/mesh_nasa_crm_hex_p1.tar.gz"

